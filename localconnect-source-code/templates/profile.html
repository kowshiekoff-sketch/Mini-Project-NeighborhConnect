{% extends "base.html" %}
{% block title %}Profile - LocalConnect{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h3 mb-3">Profile Management</h1>
          <form method="post" class="row g-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="col-md-6">
              <label class="form-label">Name</label>
              <input class="form-control" name="name" value="{{ g.user.name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input class="form-control" name="phone" value="{{ g.user.phone }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Location</label>
              <input class="form-control" name="location" value="{{ g.user.location }}">
            </div>
            {% if provider %}
              <div class="col-md-6">
                <label class="form-label">Service Type</label>
                <select class="form-select" name="service_type">
                  {% for category in categories %}
                    <option {% if provider.service_type == category %}selected{% endif %}>{{ category }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Availability</label>
                <select class="form-select" name="availability">
                  <option {% if provider.availability == 'Available' %}selected{% endif %}>Available</option>
                  <option {% if provider.availability == 'Busy' %}selected{% endif %}>Busy</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Base Price</label>
                <input class="form-control" type="number" name="price" value="{{ provider.price }}" min="0" step="50">
              </div>
              <div class="col-12">
                <label class="form-label">Address</label>
                <textarea class="form-control" name="address" rows="2" required>{{ provider.address }}</textarea>
              </div>
              <div class="col-12">
                <label class="form-label">Bio</label>
                <textarea class="form-control" name="bio" rows="4">{{ provider.bio }}</textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">Latitude</label>
                <input class="form-control" name="latitude" value="{{ provider.latitude }}">
              </div>
              <div class="col-md-6">
                <label class="form-label">Longitude</label>
                <input class="form-control" name="longitude" value="{{ provider.longitude }}">
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="emergency_enabled" id="emergencyEnabled" {% if provider.emergency_enabled %}checked{% endif %}>
                  <label class="form-check-label" for="emergencyEnabled">Allow emergency bookings</label>
                </div>
              </div>
            {% endif %}
            <div class="col-12">
              <button class="btn btn-primary">Save Profile</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
