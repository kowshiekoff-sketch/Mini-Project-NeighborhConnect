{% extends "base.html" %}
{% block title %}Find Services - LocalConnect{% endblock %}
{% block content %}
<section class="container py-4">
  <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-3">
    <div>
      <p class="eyebrow">Service search</p>
      <h1 class="h3 mb-0">Find local providers</h1>
    </div>
  </div>
  <form class="filter-bar row g-2 align-items-end mb-4">
    <div class="col-md-3">
      <label class="form-label">Service Type</label>
      <select class="form-select" name="service_type">
        <option value="">All services</option>
        {% for category in categories %}
          <option value="{{ category }}" {% if filters.service_type == category %}selected{% endif %}>{{ category }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Location</label>
      <input class="form-control" name="location" value="{{ filters.location }}" placeholder="Area">
    </div>
    <div class="col-md-2">
      <label class="form-label">Min Rating</label>
      <select class="form-select" name="min_rating">
        <option value="">Any</option>
        {% for value in [3, 4, 4.5] %}
          <option value="{{ value }}" {% if filters.min_rating|string == value|string %}selected{% endif %}>{{ value }}+</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Availability</label>
      <select class="form-select" name="availability">
        <option value="">Any</option>
        <option {% if filters.availability == 'Available' %}selected{% endif %}>Available</option>
        <option {% if filters.availability == 'Busy' %}selected{% endif %}>Busy</option>
      </select>
    </div>
    <div class="col-md-2">
      <div class="form-check mt-4">
        <input class="form-check-input" type="checkbox" name="emergency" value="1" id="emergencyFilter" {% if filters.emergency %}checked{% endif %}>
        <label class="form-check-label" for="emergencyFilter">Emergency</label>
      </div>
    </div>
    <div class="col-md-1">
      <button class="btn btn-primary w-100">Search</button>
    </div>
  </form>

  <div class="row g-3">
    {% for provider in providers %}
      {% include "partials/provider_card.html" %}
    {% else %}
      <div class="col-12">
        <div class="empty-state">No providers match your filters.</div>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
