{% extends "base.html" %}
{% block title %}Login - LocalConnect{% endblock %}
{% block content %}
<section class="container auth-wrap py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h3 mb-3">Login</h1>
          <form method="post" class="vstack gap-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" type="email" name="email" required>
            </div>
            <div>
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" type="password" name="password" required>
            </div>
            <button class="btn btn-primary">Login</button>
          </form>
          <div class="d-flex justify-content-between mt-3 small">
            <a href="{{ url_for('register') }}">Create account</a>
            <a href="{{ url_for('reset_password') }}">Forgot password?</a>
          </div>
          <hr>
          <p class="small text-muted mb-1">Demo: admin@localconnect.test / admin123</p>
          <p class="small text-muted mb-1">Demo: customer@localconnect.test / customer123</p>
          <p class="small text-muted mb-0">Demo: provider@localconnect.test / provider123</p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
